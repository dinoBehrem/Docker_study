x-logging: &default-logging
  driver: local
  options:
    max-size: "1m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:5
    profiles:
      - tools
    ports:
      - "127.0.0.1:8080:8080"
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy

  studyapp:
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - appdata:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy

secrets:
  db_password:
    file: ./secrets/db_config.txt

volumes:
  pgdata:
  appdata: