services:
  db:
    healthcheck:
      retries: 2

  studyapp:
    image: node-version-arg
    build:
      context: .
      target: dev
      args:
        - NODE_VERSION=24
    ports:
      - "127.0.0.1:3001:3000"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json